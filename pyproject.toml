[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regnav"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "einops>=0.8,<1",
    "mlflow>=3,<4",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "timm>=1,<2",
    "torch>=2,<3",
    "torchvision>=0.15,<1",
]

[project.scripts]
train-regnav = "regnav.train:main"
eval-regnav = "regnav.evaluate:main"
infer-regnav = "regnav.inference:main"

[dependency-groups]
test = ["pytest>=8,<10"]
data = ["rosbags>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
